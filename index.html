<!DOCTYPE html>
<html lang="en">

<head>

    <title>Hanna Fiegenbaum | Ecological Economist</title>

    <meta name="description"
          content="Hanna Fiegenbaum – ecological economist working on nature-positive decision making, environmental economics and finance.">

    <meta charset="utf-8">
    <meta name="robots" content="index, follow">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

        :root {
            --background: #f6f3ed;
            --anthracite: #333333;
            --black: #000000;
            --blue: #17365d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: var(--background);
            color: var(--anthracite);

            font-family:
                Palatino,
                "Palatino Linotype",
                "Book Antiqua",
                Georgia,
                serif;
        }


        /* =========================
           PAGE
        ========================= */

        .page {
            max-width: 1500px;
            margin: 0 auto;
            padding: 55px 70px 0;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }


        /* NAME */

        .name {
            display: block;

            font-family:
                "Avenir Next",
                Avenir,
                "Helvetica Neue",
                Arial,
                sans-serif;

            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.02em;

            color: var(--black);
            text-decoration: none;
        }


        /* SHORT BIO */

        .short-bio {
            max-width: 280px;
            margin: 25px 0 0;

            font-family:
                Palatino,
                "Palatino Linotype",
                "Book Antiqua",
                Georgia,
                serif;

            font-size: 16px;
            line-height: 1.55;

            color: var(--anthracite);
        }


        /* CONTACT + IMPRESSUM */

        .small-nav {
            display: flex;
            gap: 22px;
            padding-top: 4px;
        }

        .small-nav a {
            font-family:
                "Avenir Next",
                Avenir,
                "Helvetica Neue",
                Arial,
                sans-serif;

            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.03em;

            color: var(--anthracite);
            text-decoration: none;
        }

        .small-nav a:hover {
            color: var(--blue);
        }


        /* =========================
           FOUR SECTIONS
        ========================= */

        .sections {
            margin-top: 90px;

            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
        }


        /* SECTION TITLE */

        .section-link {
            display: block;
            margin-bottom: 18px;

            font-family:
                Palatino,
                "Palatino Linotype",
                "Book Antiqua",
                Georgia,
                serif;

            font-size: 19px;
            font-weight: 400;

            color: var(--black);
            text-decoration: none;
        }

        .section-link:hover {
            color: var(--blue);
        }


        /* PHOTO */

        .section-card img {
            display: block;

            width: 100%;
            aspect-ratio: 4 / 5;

            object-fit: cover;

            border: 1px solid var(--black);

            transition: opacity 0.2s ease;
        }

        .section-card a:hover img {
            opacity: 0.88;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            max-width: 1500px;
            margin: 0 auto;

            padding: 55px 70px 50px;
        }

        footer a {
            margin-right: 25px;

            font-family:
                Palatino,
                "Palatino Linotype",
                "Book Antiqua",
                Georgia,
                serif;

            font-size: 14px;

            color: var(--blue);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 900px) {

            .page {
                padding: 40px 35px 0;
            }

            .sections {
                grid-template-columns: repeat(2, 1fr);
                gap: 50px 25px;
            }

            footer {
                padding: 45px 35px 40px;
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 550px) {

            .page {
                padding: 30px 25px 0;
            }

            header {
                display: block;
            }

            .small-nav {
                margin-top: 30px;
            }

            .sections {
                margin-top: 60px;
                grid-template-columns: 1fr;
                gap: 45px;
            }

            .section-card img {
                aspect-ratio: 4 / 5;
            }

            footer {
                padding: 40px 25px;
            }

            footer a {
                display: inline-block;
                margin-bottom: 10px;
            }

        }

    </style>

</head>


<body>

                </a>

                        src="img/research.jpg"

                </a>

            </div>



            <!-- PUBLICATIONS -->

            <div class="section-card">

                <a href="publications.html"
                   class="section-link">
                    Publications
                </a>

                <a href="publications.html">

                    <img
                        src="img/publications.jpg"

                </a>

            </div>



            <!-- PROJECTS -->

            <div class="section-card">

                <a href="projects.html"
                   class="section-link">
                    Projects
                </a>

                <a href="projects.html">

                    <img
                        src="img/projects.jpg"
                        alt="Projects">

                </a>

            </div>


        </main>

    </div>



    <!-- FOOTER -->

    <footer>

        </a>

</body>

</html>
