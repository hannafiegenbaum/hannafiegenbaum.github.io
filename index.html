<!DOCTYPE html>
<html lang="en">

<head>

    <title>Hanna Fiegenbaum | Sustainability strategist and ecological economist</title>

    <meta name="description"
          content="Hanna Fiegenbaum – ecological economist working on nature-related decision making, environmental economics and finance.">

    <meta charset="utf-8">
    <meta name="robots" content="index, follow">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

        :root {
            --background: #f6f3ed;
            --anthracite: #333333;
            --black: #000000;
            --blue: #17365d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: var(--background);
            color: var(--anthracite);

            font-family:
                Palatino,
                "Palatino Linotype",
                "Book Antiqua",
                Georgia,
                serif;
        }


        /* -------------------------
           HEADER
        ------------------------- */

        .banner {
            width: 100%;
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 45px 40px 25px;

            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }


        /* Hanna Fiegenbaum = Avenir */

        nav h1 {
            margin: 0;

            font-family:
                "Avenir Next",
                Avenir,
                "Helvetica Neue",
                Arial,
                sans-serif;

            font-size: 25px;
            font-weight: 500;
            letter-spacing: 0.01em;
        }

        nav h1 a {
            color: var(--black);
            text-decoration: none;
        }


        /* Navigation = Palatino */

        nav ul {
            display: flex;
            gap: 30px;

            list-style: none;
            margin: 0;
            padding: 0;
        }

        nav li {
            font-size: 18px;
        }

        nav a {
            color: var(--anthracite);
            text-decoration: none;
        }

        nav ul a:hover {
            color: var(--blue);
        }


        /* -------------------------
           HOME IMAGE GRID
        ------------------------- */

        .main-home {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 40px 80px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
        }

        .single-img a {
            text-decoration: none;
            color: var(--anthracite);
        }


        /* PHOTOS */

        .single-img img {
            width: 100%;
            aspect-ratio: 4 / 5;

            object-fit: cover;
            display: block;

            /* thin black frame */
            border: 1px solid var(--black);
        }


        /* TEXT BELOW PHOTOS */

        .text-below-images {
            display: block;
            margin-top: 14px;

            font-family:
                Palatino,
                "Palatino Linotype",
                "Book Antiqua",
                Georgia,
                serif;

            font-size: 19px;
            font-weight: normal;
        }

        .single-img a:hover .text-below-images {
            color: var(--blue);
        }


        /* -------------------------
           FOOTER
        ------------------------- */

        footer {
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 40px 45px;

            font-size: 15px;
        }

        footer a {
            color: var(--anthracite);
            text-decoration: none;
            margin-right: 22px;
        }

        footer a:hover {
            color: var(--blue);
        }


        /* -------------------------
           MOBILE
        ------------------------- */

        @media (max-width: 750px) {

            nav {
                display: block;
                padding: 30px 25px 20px;
            }

            nav ul {
                margin-top: 18px;
                gap: 18px;
                flex-wrap: wrap;
            }

            .main-home {
                padding: 40px 25px 60px;
            }

            .container {
                grid-template-columns: repeat(2, 1fr);
                gap: 35px 20px;
            }

            footer {
                padding: 10px 25px 35px;
            }
        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <div class="banner">

        <nav>

                <a href="index.html">

                </li>

                </li>

                </li>

                <li>

                </li>

            </ul>

        </nav>

    </div>



    <!-- HOME -->

    <main class="main-home">

        <div class="container">


            <!-- ABOUT -->

            <div class="single-img">

                <a href="about.html">

                    <img
                        src="img/about.jpg"
                        alt="About Hanna Fiegenbaum">

                    <span class="text-below-images">
                        About
                    </span>

                </a>

            </div>



            <!-- RESEARCH -->

            <div class="single-img">

                <a href="research.html">

            <!-- PUBLICATIONS -->

                    <img
                        src="img/publications.jpg"

                    <span class="text-below-images">
                        Publications
                    </span>

                </a>

            </div>



            <!-- PROJECTS -->

            <div class="single-img">

                <a href="projects.html">

                    <img
                        src="img/projects.jpg"

                    <span class="text-below-images">
                        Projects
                    </span>

                </a>

            </div>


        </div>

    </main>

</body>

</html>
