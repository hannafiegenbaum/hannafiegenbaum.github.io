<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hanna Fiegenbaum</title>

  <style>
    :root {
      --background: #f5f2ec;
      --text: #292929;
      --black: #111111;
      --blue: #17375e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.55;
    }

    .page {
      width: min(1120px, calc(100% - 80px));
      margin: 0 auto;
    }

    /* HEADER */

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 48px 0 32px;
    }

    .name {
      color: var(--black);
      font-size: 20px;
      font-weight: 600;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 28px;
    }

    nav a {
      color: var(--text);
      text-decoration: none;
      font-size: 15px;
    }

    nav a:hover {
      color: var(--blue);
    }

    /* MAIN */

    main {
      padding: 100px 0 120px;
    }

    .intro {
      max-width: 780px;
    }

    h1 {
      margin: 0 0 28px;
      color: var(--black);
      font-size: clamp(42px, 6vw, 72px);
      line-height: 1.05;
      font-weight: 500;
      letter-spacing: -0.035em;
    }

    .intro p {
      max-width: 650px;
      margin: 0;
      font-size: 21px;
      line-height: 1.6;
    }

    .intro a {
      color: var(--blue);
    }

    /* PHOTO */

    .hero-photo {
      width: 100%;
      margin-top: 90px;
    }

    .hero-photo img {
      display: block;
      width: 100%;
      max-height: 620px;
      object-fit: cover;
    }

    /* FOOTER */

    footer {
      padding: 35px 0 50px;
      font-size: 14px;
    }

    footer a {
      color: var(--blue);
      text-decoration: none;
      margin-right: 20px;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* MOBILE */

    @media (max-width: 700px) {
      .page {
        width: min(100% - 40px, 1120px);
      }

      header {
        display: block;
        padding-top: 30px;
      }

      nav {
        margin-top: 18px;
        gap: 16px;
        flex-wrap: wrap;
      }

      main {
        padding-top: 65px;
      }

      .intro p {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header>
      <a class="name" href="index.html">Hanna Fiegenbaum</a>

      <nav>
        <a href="about.html">About</a>
        <a href="research.html">Research</a>
        <a href="publications.html">Publications</a>
        <a href="projects.html">Projects</a>
      </nav>
    </header>


    <main>

      <section class="intro">

        <h1>Hanna Fiegenbaum</h1>

        <p>
          Ecological economist working at the intersection of
          decision science, environmental economics and finance,
          and nature-positive decision making.
        </p>

      </section>


      <!-- We will add your photograph here later.

      <section class="hero-photo">
        <img src="images/photo.jpg" alt="">
      </section>

      -->

    </main>


    <footer>
      <a href="https://www.linkedin.com/">LinkedIn</a>
      <a href="https://github.com/hannafiegenbaum">GitHub</a>
    </footer>

  </div>

</body>
</html>
