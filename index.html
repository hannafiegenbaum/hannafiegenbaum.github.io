<!DOCTYPE html>
<html lang="en">

<head>

    <title>Hanna Fiegenbaum | Ecological Economist</title>

    <meta name="description"
          content="Hanna Fiegenbaum – ecological economist working on nature-positive decision making, environmental economics and finance.">

    <meta charset="utf-8">
    <meta name="robots" content="index, follow">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

        :root {
            --background: #f6f3ed;
            --anthracite: #333333;
            --black: #000000;
            --blue: #17365d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: var(--background);
            color: var(--anthracite);

            font-family:
                Palatino,
                "Palatino Linotype",
                "Book Antiqua",
                Georgia,
                serif;
        }


        /* =====================================
           SMALL NAVIGATION TOP RIGHT
        ===================================== */

        .top-nav {
            max-width: 1650px;
            margin: 0 auto;

            padding: 18px 45px 0;

            display: flex;
            justify-content: flex-end;
            gap: 18px;
        }

        .top-nav a {
            font-family:
                "Avenir Next",
                Avenir,
                "Helvetica Neue",
                Arial,
                sans-serif;

            font-size: 10px;
            font-weight: 400;
            letter-spacing: 0.05em;

            color: var(--anthracite);
            text-decoration: none;
        }

        .top-nav a:hover {
            color: var(--blue);
        }


        /* =====================================
           MAIN HOME AREA
        ===================================== */

        .home {
            max-width: 1650px;
            margin: 0 auto;

            padding: 5px 45px 75px;
        }


        /*

        Hanna Fiegenbaum | About | Research | Publications | Projects

        */

        .home-grid {
            display: grid;

            grid-template-columns:
                2.2fr
                repeat(4, 1.35fr);

            gap: 26px;

            align-items: start;
        }


        /* =====================================
           NAME
        ===================================== */

        .name {
            display: block;

            font-family:
                "Avenir Next",
                Avenir,
                "Helvetica Neue",
                Arial,
                sans-serif;

            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.02em;

            color: var(--black);
            text-decoration: none;
        }


        /* =====================================
           SHORT BIO
        ===================================== */

        .short-bio {
            max-width: 270px;

            margin: 28px 0 0;

            font-family:
                Palatino,
                "Palatino Linotype",
                "Book Antiqua",
                Georgia,
                serif;

            font-size: 16px;
            line-height: 1.55;
            font-weight: 400;

            color: var(--anthracite);
        }


        /* =====================================
           MAIN SECTION TITLES
        ===================================== */

        .section-link {
            display: block;

            margin-bottom: 14px;

            font-family:
                Palatino,
                "Palatino Linotype",
                "Book Antiqua",
                Georgia,
                serif;

            font-size: 19px;
            font-weight: 400;

            color: var(--black);
            text-decoration: none;
        }

        .section-link:hover {
            color: var(--blue);
        }


        /* =====================================
           BIG PHOTOS
        ===================================== */

        .section-card img {
            display: block;

            width: 100%;
            aspect-ratio: 3 / 4;

            object-fit: cover;

            border: 1px solid var(--black);

            transition: opacity 0.2s ease;
        }

        .section-card a:hover img {
            opacity: 0.88;
        }


        /* =====================================
           FOOTER
        ===================================== */

        footer {
            max-width: 1650px;
            margin: 0 auto;

            padding: 15px 45px 45px;
        }

        footer a {
            margin-right: 25px;

            font-family:
                Palatino,
                "Palatino Linotype",
                "Book Antiqua",
                Georgia,
                serif;

            font-size: 15px;

            color: var(--blue);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }


        /* =====================================
           TABLET
        ===================================== */

        @media (max-width: 1000px) {

            .top-nav {
                padding: 18px 35px 0;
            }

            .home {
                padding: 10px 35px 65px;
            }

            .home-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 50px 25px;
            }

            .name-area {
                grid-column: 1 / -1;
                margin-bottom: 10px;
            }

            .short-bio {
                max-width: 450px;
            }

            footer {
                padding: 15px 35px 40px;
            }

        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 600px) {

            .top-nav {
                padding: 15px 25px 0;
            }

            .home {
                padding: 10px 25px 50px;
            }

            .home-grid {
                grid-template-columns: 1fr;
                gap: 45px;
            }

            .name-area {
                grid-column: auto;
                margin-bottom: 10px;
            }

            .section-link {
                margin-bottom: 12px;
            }

            .section-card img {
                aspect-ratio: 3 / 4;
            }

            footer {
                padding: 10px 25px 35px;
            }

            footer a {
                display: inline-block;
                margin-bottom: 10px;
            }

        }

    </style>

</head>

        </div>

    </main>

</html>
