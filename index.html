<!DOCTYPE html>
<html lang="en">

<head>

    <title>Hanna Fiegenbaum | Ecological Economist</title>

    <meta name="description"
          content="Hanna Fiegenbaum – ecological economist and sustainability practitioner working on nature-related decision making, environmental economics and finance.">

    <meta charset="utf-8">
    <meta name="robots" content="index, follow">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

        :root {
            --background: #f6f3ed;
            --anthracite: #333333;
            --black: #000000;
            --blue: #17365d;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            background-color: var(--background);
            color: var(--anthracite);
        }


        /* =====================================
           TOP AREA
        ===================================== */

        .top-area {
            max-width: 1650px;
            margin: 0 auto;
            padding: 35px 45px 0;

            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }


        /* =====================================
           NAME
        ===================================== */

        .name {
            display: block;

            font-family:
                "Avenir Next",
                Avenir,
                "Helvetica Neue",
                Arial,
                sans-serif;

            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.02em;

            color: var(--black);
            text-decoration: none;
        }


        /* =====================================
           SHORT BIO
        ===================================== */

        .short-bio {
            max-width: 290px;
            margin: 38px 0 0;

            font-family:
                "Avenir Next",
                Avenir,
                "Helvetica Neue",
                Arial,
                sans-serif;

            font-size: 15px;
            line-height: 1.55;
            font-weight: 400;

            color: var(--anthracite);
        }


        /* =====================================
           CONTACT + IMPRESSUM
        ===================================== */

        .top-nav {
            display: flex;
            gap: 20px;
        }

        .top-nav a {
            font-family:
                "Avenir Next",
                Avenir,
                "Helvetica Neue",
                Arial,
                sans-serif;

            font-size: 10px;
            font-weight: 400;
            letter-spacing: 0.05em;

            color: var(--anthracite);
            text-decoration: none;
        }

        .top-nav a:hover {
            color: var(--blue);
        }


        /* =====================================
           CENTRAL IMAGE NAVIGATION
        ===================================== */

        .visual-navigation {
            max-width: 1380px;

            /* complete block slightly above centre */
            margin: 65px auto 0;

            padding: 0 45px;

            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 38px;
        }


        /* =====================================
           SECTION HEADINGS
        ===================================== */

        .section-link {
            display: block;
            margin-bottom: 18px;

            font-family:
                Palatino,
                "Palatino Linotype",
                "Book Antiqua",
                Georgia,
                serif;

            font-size: 20px;
            line-height: 1.2;
            font-weight: 400;

            color: var(--black);
            text-decoration: none;
        }

        .section-link:hover {
            color: var(--blue);
        }


        /* =====================================
           PHOTOS
        ===================================== */

        .photo-link {
            display: block;
        }

        .section-card img {
            display: block;

            width: 100%;
            aspect-ratio: 4 / 5;

            object-fit: cover;

            border: 1px solid var(--black);

            transition: opacity 0.2s ease;
        }

        .photo-link:hover img {
            opacity: 0.88;
        }


        /* =====================================
           FOOTER
        ===================================== */

        footer {
            max-width: 1650px;
            margin: 75px auto 0;

            padding: 0 45px 45px;
        }

        footer a {
            margin-right: 30px;

            font-family:
                "Avenir Next",
                Avenir,
                "Helvetica Neue",
                Arial,
                sans-serif;

            font-size: 14px;
            font-weight: 400;

            color: var(--blue);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }


        /* =====================================
           TABLET
        ===================================== */

        @media (max-width: 1000px) {

            .top-area {
                padding: 35px 35px 0;
            }

            .visual-navigation {
                margin-top: 60px;
                padding: 0 35px;

                grid-template-columns: repeat(2, 1fr);
                gap: 55px 25px;
            }

            footer {
                padding: 0 35px 40px;
            }

        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 600px) {

            .top-area {
                padding: 30px 25px 0;
            }

            .short-bio {
                max-width: 240px;
                margin-top: 25px;
            }

            .top-nav {
                gap: 12px;
            }

            .visual-navigation {
                margin-top: 50px;
                padding: 0 25px;

                grid-template-columns: 1fr;
                gap: 50px;
            }

            footer {
                margin-top: 60px;
                padding: 0 25px 35px;
            }

            footer a {
                display: inline-block;
                margin-right: 20px;
                margin-bottom: 10px;
            }

        }

    </style>

</head>


<body>


    <!-- TOP -->

    <header class="top-area">

            </a>

        </div>



        <!-- RESEARCH -->

        <div class="section-card">

               class="section-link">

            </a>

            <a href="research.html"

        <!-- PUBLICATIONS -->

        <div class="section-card">

            </a>

            <a href="publications.html"
               class="photo-link">

                <img
                    src="img/publications.jpg"
                    alt="Publications">

            </a>

        </div>



        <!-- PROJECTS -->

        <div class="section-card">

            <a href="projects.html"
               class="section-link">
                Projects
            </a>

            <a href="projects.html"
               class="photo-link">

                <img
                    src="img/projects.jpg"
                    alt="Projects">

            </a>

        </div>


    </main>



    <!-- FOOTER -->

    <footer>

        <a href="mailto:hanna.fiegenbaum@uni-leipzig.de">

</body>

</html>
