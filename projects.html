<!DOCTYPE html>
<html lang="en">

<head>

    <title>Projects | Hanna Fiegenbaum</title>

    <meta name="description"
          content="Selected Projects by Hanna Fiegenbaum.">

    <meta charset="utf-8">
    <meta name="robots" content="index, follow">
    <meta name="viewport" content="width=device-width, initial-scale=1">
 <link rel="icon" type="image/png" href="img/favicon.png">

    <style>

        :root {
            --background: #f3f6ee;
            --anthracite: #333333;
            --black: #000000;
            --blue: #17365d;
            --green: #87FAB1;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            background-color: var(--background);
            color: var(--black);
        }


        /* =====================================
           HEADER
        ===================================== */

        header {
            max-width: 1650px;
            margin: 0 auto;
            padding: 35px 45px 0;

            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }


        /* =====================================
           NAME
        ===================================== */

        .name {
            display: block;
            position: relative;
            padding-left: 47px;

            font-family:
                "Times New Roman",
                Times,
                serif;

            font-size: 24px;
            font-weight: 400;
            letter-spacing: 0;

            color: var(--black);
            text-decoration: none;
        }

        .name:hover {
            color: var(--green);
        }

        .name-logo {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);

            display: block;
            width: 38px;
            height: 38px;
            object-fit: contain;
        }


        /* =====================================
           CONTACT + IMPRESSUM
        ===================================== */

        .top-nav {
            display: flex;
            gap: 20px;
        }

        .top-nav a {
            font-family:
                "Avenir Next",
                Avenir,
                "Helvetica Neue",
                Arial,
                sans-serif;

            font-size: 10px;
            font-weight: 400;
            letter-spacing: 0.05em;

            color: var(--black);
            text-decoration: none;
        }

        .top-nav a:hover {
            color: var(--green);
        }


        /* =====================================
           MAIN
        ===================================== */

        main {
            max-width: 1250px;
            margin: 65px auto 0;
            padding: 0 45px;
            min-height: 450px;
        }

        h1 {
            margin: 0;

            font-family:
                "Times New Roman",
                Times,
                serif;

            font-size: 20px;
            line-height: 1.1;
            font-weight: 700;

            color: var(--black);
        }


        /* =====================================
           PROJECT GRID
        ===================================== */

        .project-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;

            margin-top: 45px;
        }


        /* =====================================
           PROJECT CARD
        ===================================== */

        .project-card {
            display: block;

            padding: 13px 13px 20px;

            border: 1px solid var(--black);

            color: var(--black);
            text-decoration: none;
            background: transparent;

            cursor: pointer;
        }

        .project-card-image {
            display: block;

            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;

            border: 1px solid var(--black);
        }

        .project-card-title {
            margin: 16px 3px 0;

            font-family:
                "Times New Roman",
                Times,
                serif;

            font-size: 17px;
            line-height: 1.3;
            font-weight: 400;

            color: var(--black);
        }

        .project-card-year {
            margin: 7px 3px 0;

            font-family:
                "Avenir Next",
                Avenir,
                "Helvetica Neue",
                Arial,
                sans-serif;

            font-size: 11px;
            line-height: 1.3;
            font-weight: 400;

            color: var(--black);
        }

        .project-card:hover .project-card-title {
            color: var(--green);
        }


        /* =====================================
           PROJECT DETAIL
        ===================================== */

        .project-detail {
            display: none;
        }

        .project-detail.active {
            display: block;
        }

        .project-back {
            display: inline-block;
            margin-bottom: 35px;

            font-family:
                "Avenir Next",
                Avenir,
                "Helvetica Neue",
                Arial,
                sans-serif;

            font-size: 12px;
            font-weight: 400;

            color: var(--black);
            text-decoration: none;
        }

        .project-back:hover {
            color: var(--green);
        }

        .project-detail-title {
            max-width: 780px;
            margin: 0 0 8px;

            font-family:
                "Times New Roman",
                Times,
                serif;

            font-size: 24px;
            line-height: 1.25;
            font-weight: 400;

            color: var(--black);
        }

        .project-detail-year {
            margin: 0 0 30px;

            font-family:
                "Avenir Next",
                Avenir,
                "Helvetica Neue",
                Arial,
                sans-serif;

            font-size: 12px;
            font-weight: 400;

            color: var(--black);
        }

        .project-detail-description {
            max-width: 680px;

            font-family:
                "Avenir Next",
                Avenir,
                "Helvetica Neue",
                Arial,
                sans-serif;

            font-size: 14px;
            line-height: 1.65;
            font-weight: 400;

            color: var(--black);
        }

        .project-detail-description p {
            margin: 0 0 17px;
        }


        /* =====================================
           FOOTER
        ===================================== */

        footer {
            max-width: 1650px;
            margin: 70px auto 0;
            padding: 0 45px 45px;
        }

        footer a {
            margin-right: 30px;

            font-family:
                "Avenir Next",
                Avenir,
                "Helvetica Neue",
                Arial,
                sans-serif;

            font-size: 14px;
            font-weight: 400;

            color: var(--black);
            text-decoration: none;
        }

        footer a:hover {
            color: var(--green);
        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 760px) {

            header {
                padding: 30px 25px 0;
            }

            .name {
                font-size: 24px;
            }

            .top-nav {
                gap: 12px;
            }

            main {
                margin-top: 50px;
                padding: 0 25px;
            }

            h1 {
                font-size: 20px;
            }

            .project-grid {
                grid-template-columns: 1fr;
            }

            .project-card {
                max-width: 360px;
            }

            footer {
                margin-top: 60px;
                padding: 0 25px 35px;
            }

            footer a {
                display: inline-block;
                margin-right: 20px;
                margin-bottom: 10px;
            }
        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header>

        <a class="name" href="index.html">
            <img
                src="img/favicon.png"
                alt=""
                class="name-logo">
            Hanna Fiegenbaum
        </a>

        <nav class="top-nav">

           <a href="datenschutz.html">Privacy</a>

            <a href="impressum.html">
                Impressum
            </a>

        </nav>

    </header>


    <!-- MAIN -->

    <main>


        <!-- PROJECT OVERVIEW -->

        <div id="project-overview">

            <h1>Selected Projects</h1>

            <div
                id="project-grid"
                class="project-grid">
            </div>

        </div>


        <!-- PROJECT DETAIL -->

        <div
            id="project-detail"
            class="project-detail">

            <a
                href="projects.html"
                id="project-back"
                class="project-back">
                ← Selected Projects
            </a>

            <div
                id="project-detail-title"
                class="project-detail-title">
            </div>

            <div
                id="project-detail-year"
                class="project-detail-year">
            </div>

            <div
                id="project-detail-description"
                class="project-detail-description">
            </div>

        </div>


    </main>


    <!-- FOOTER -->

    <footer>

        <a href="mailto:hanna.fiegenbaum@uni-leipzig.de">
            Email
        </a>

        <a href="https://orcid.org/0000-0002-2462-5924"
           target="_blank">
            ORCID
        </a>

        <a href="https://github.com/hannafiegenbaum"
           target="_blank">
            GitHub
        </a>

        <a href="https://www.linkedin.com/in/hannafiegenbaum/"
           target="_blank">
            LinkedIn
        </a>

        <a href="https://www.instagram.com/hannafiegenbaum/"
           target="_blank">
            Instagram
        </a>

        <a href="https://bsky.app/profile/hannafiegenbaum.bsky.social"
           target="_blank">
            Bluesky
        </a>

    </footer>


    <!-- PROJECT DATA -->

    <script src="projects-data.js"></script>


    <!-- PROJECT LOGIC -->

    <script>

        const projectGrid =
            document.getElementById("project-grid");

        const projectOverview =
            document.getElementById("project-overview");

        const projectDetail =
            document.getElementById("project-detail");

        const detailTitle =
            document.getElementById("project-detail-title");

        const detailYear =
            document.getElementById("project-detail-year");

        const detailDescription =
            document.getElementById("project-detail-description");

        const projectBack =
            document.getElementById("project-back");


        /* =====================================
           CREATE PROJECT CARDS
        ===================================== */

        function renderProjects() {

            projectGrid.innerHTML = "";

            projects.forEach(project => {

                const card =
                    document.createElement("a");

                card.className = "project-card";
                card.href = "#" + project.id;


                const image =
                    document.createElement("img");

                image.className = "project-card-image";
                image.src = project.cover;
                image.alt = project.title;


                const title =
                    document.createElement("div");

                title.className = "project-card-title";
                title.textContent = project.title;


                const year =
                    document.createElement("div");

                year.className = "project-card-year";
                year.textContent = project.year;


                card.appendChild(image);
                card.appendChild(title);
                card.appendChild(year);


                card.addEventListener("click", function(event) {

                    event.preventDefault();

                    history.pushState(
                        null,
                        "",
                        "#" + project.id
                    );

                    showProject(project.id);

                });


                projectGrid.appendChild(card);

            });

        }


        /* =====================================
           SHOW PROJECT
        ===================================== */

        function showProject(projectId) {

            const project =
                projects.find(
                    project => project.id === projectId
                );


            if (!project) {
                showOverview();
                return;
            }


            projectOverview.style.display = "none";

            projectDetail.classList.add("active");


            detailTitle.textContent =
                project.title;

            detailYear.textContent =
                project.year;

            detailDescription.innerHTML = "";


            project.description.forEach(paragraph => {

                const p =
                    document.createElement("p");

                p.textContent = paragraph;

                detailDescription.appendChild(p);

            });


            window.scrollTo(0, 0);

        }


        /* =====================================
           SHOW OVERVIEW
        ===================================== */

        function showOverview() {

            projectDetail.classList.remove("active");

            projectOverview.style.display = "block";

        }


        /* =====================================
           BACK LINK
        ===================================== */

        projectBack.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                history.pushState(
                    null,
                    "",
                    window.location.pathname
                );

                showOverview();

                window.scrollTo(0, 0);

            }
        );


        /* =====================================
           BROWSER BACK / FORWARD
        ===================================== */

        function routeFromURL() {

            const projectId =
                window.location.hash.substring(1);

            if (projectId) {

                showProject(projectId);

            } else {

                showOverview();

            }

        }


        window.addEventListener(
            "popstate",
            routeFromURL
        );


        /* =====================================
           INITIALISE
        ===================================== */

        renderProjects();

        routeFromURL();


    </script>


</body>

</html>
